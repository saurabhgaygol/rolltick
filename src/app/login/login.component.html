<!--
  Structure:
  .page  = white background with a 20px gap all around
  .stage = the purple artwork, always kept at its original 3786 x 2054 shape
  .fx    = animated lights sitting on top of the artwork
  .card  = the real login form
-->
<div class="page">
  <div class="stage" #stage>

    <!-- the illustration (hidden on small screens) -->
    <img class="bg" src="assets/login-hero.webp" alt="Attendance hardware illustration" />

    <!-- ================= YOUR LOGO =================
         Swap assets/logo.svg with your own file. Nothing else to change,
         the position and size are handled by the .brand rule in the CSS. -->
    <img class="brand" src="assets/logo.svg" alt="Company logo" />

    <!-- ================= animated lights ================= -->
    <div class="fx" aria-hidden="true">

      <!-- big soft lights drifting in the background -->
      <span class="aura" *ngFor="let a of auras" [ngClass]="a.tone" [style.left]="a.x" [style.top]="a.y"
        [style.width]="a.size" [style.animationDuration]="a.duration" [style.animationDelay]="a.delay"></span>

      <!-- green status LEDs on the readers -->
      <span class="glow" *ngFor="let led of leds" [ngClass]="led.tone" [style.left]="led.x" [style.top]="led.y"
        [style.width]="led.size" [style.animationDuration]="led.duration" [style.animationDelay]="led.delay"></span>

      <!-- signal rings: three rings per reader, each starting later -->
      <ng-container *ngFor="let source of signalSources">
        <span class="ring tone-purple" *ngFor="let delay of ringDelays" [style.left]="source.x" [style.top]="source.y"
          [style.width]="source.size" [style.animationDelay]="delay"></span>
      </ng-container>

      <!-- the four dots in the middle -->
      <span class="glow" *ngFor="let dot of connectorDots" [ngClass]="dot.tone" [style.left]="dot.x" [style.top]="dot.y"
        [style.width]="dot.size" [style.animationDuration]="dot.duration" [style.animationDelay]="dot.delay"></span>

      <!-- badge and screen halos -->
      <span class="halo" *ngFor="let h of halos" [ngClass]="h.tone" [style.left]="h.x" [style.top]="h.y"
        [style.width]="h.size" [style.animationDuration]="h.duration" [style.animationDelay]="h.delay"></span>

      <!-- light strips -->
      <span class="bar" *ngFor="let b of lightBars" [ngClass]="b.tone" [style.left]="b.x" [style.top]="b.y"
        [style.width]="b.width" [style.height]="b.height" [style.animationDuration]="b.duration"
        [style.animationDelay]="b.delay"></span>

      <!-- floating dust -->
      <span class="dust" *ngFor="let d of dust" [style.left]="d.x" [style.top]="d.y" [style.width]="d.size"
        [style.animationDuration]="d.duration" [style.animationDelay]="d.delay"></span>

      <!-- scan line inside the face recognition screen -->
      <span class="scan"></span>

      <!-- slow light sweep across the whole panel -->
      <span class="sheen" style="transform: none;"></span>
    </div>

    <!-- ================= login form ================= -->
    <form class="card" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

      <h1 class="title">Welcome Back...</h1>
      <p class="subtitle">Please enter your email and password</p>

      <!-- email -->
      <div class="field email" [class.invalid]="email.touched && email.invalid">
        <span class="lead" aria-hidden="true">
          <svg viewBox="0 0 24 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
            <rect x="1" y="1" width="22" height="18" rx="2.4" />
            <path d="M1.8 2.2 12 11 22.2 2.2" />
          </svg>
        </span>

        <input type="email" formControlName="email" placeholder="user@gmail.com" autocomplete="email" />

        <span class="trail" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
            <circle cx="12" cy="12" r="4" />
            <path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8" />
          </svg>
        </span>
      </div>

      <!-- password -->
      <div class="field pass" [class.invalid]="password.touched && password.invalid">
        <span class="lead" aria-hidden="true">
          <svg viewBox="0 0 20 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
            <rect x="1" y="9" width="18" height="14" rx="3" />
            <path d="M5.2 9V5.6a4.8 4.8 0 0 1 9.6 0V9" />
            <circle cx="10" cy="15.4" r="1.5" />
            <path d="M10 17v2.4" />
          </svg>
        </span>

        <input [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="Password"
          autocomplete="current-password" />

        <button class="trail" type="button" (click)="togglePassword()"
          [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
          <svg viewBox="0 0 24 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M1 8s4-7 11-7 11 7 11 7-4 7-11 7S1 8 1 8Z" />
            <circle cx="12" cy="8" r="3.1" />
          </svg>
        </button>
      </div>

      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

      <p class="terms">
        By login, you agree to our <a href="#">Terms &amp; Conditions</a>
      </p>

      <button class="cta" type="submit" [disabled]="loading">
        <span>{{ loading ? 'please wait...' : 'login...' }}</span>
        <svg viewBox="0 0 34 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M1 8h31" />
          <path d="M25.5 1.5 32 8l-6.5 6.5" />
        </svg>
      </button>



      <div class="rule"></div>

      <p class="signup">
        <a class="forgot" href="#">
          <svg viewBox="0 0 16 22" fill="currentColor">
            <path
              d="M8 0a8 8 0 0 0-8 8c0 5.8 7.1 13.4 7.4 13.7a.8.8 0 0 0 1.2 0C8.9 21.4 16 13.8 16 8a8 8 0 0 0-8-8Zm0 11.2A3.2 3.2 0 1 1 11.2 8 3.2 3.2 0 0 1 8 11.2Z" />
          </svg>
          <span>Forget Password</span>
        </a>

      </p>
    </form>

    <!-- invisible links sitting on the footer text that is part of the picture -->
    <a class="hot twitter" href="#" aria-label="Twitter"></a>
    <a class="hot instagram" href="#" aria-label="Instagram"></a>
    <a class="hot privacy" href="#" aria-label="Privacy"></a>
    <a class="hot tos" href="#" aria-label="Terms of Service"></a>

    <!-- footer for small screens, where the picture is hidden -->
    <div class="mfoot">
      <a href="#">Twitter</a><i>&middot;</i>
      <a href="#">instagram</a><i>&middot;</i>
      <a href="#">Privacy</a><i>&middot;</i>
      <a href="#">Terms of Service</a><br />
      &copy;2021 All Rights Reserved.
    </div>

  </div>
</div>
